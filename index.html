<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Photographer Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.7;
    }

    header {
      padding: 4rem 2rem 2rem;
      text-align: center;
    }
    header h1 { font-size: 3.5rem; font-weight: 500; }
    header p { color: #777; font-size: 0.95rem; margin-top: 0.5rem; }

    nav {
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }
    nav a {
      margin: 0 1rem;
      color: #777;
      text-decoration: none;
    }
    nav a:hover { color: #111; }

    section {
      padding: 4rem 2rem;
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 2rem;
    }

    /* About */
    .about {
      max-width: 700px;
      margin: auto;
      text-align: center;
      font-size: 0.95rem;
      color: #444;
    }

    /* Categories */
    

    /* Masonry Gallery */
    
.gallery-links {
  display: grid;
  gap: 3rem;              /* more breathing room */
  max-width: 1000px;      /* wider layout */
  margin: 5rem auto;      /* more vertical presence */
  padding: 0 2rem;
}

.gallery-links a {
  text-decoration: none;
  color: #111;
}

.gallery-links img {
  width: 100%;
  height: auto;           /* keeps original proportions */
  border-radius: 6px;
  transition: transform 0.4s ease, opacity 0.3s ease;
}

.gallery-links img:hover {
  transform: scale(1.02);
  opacity: 0.95;
}
   
.gallery-item {
  position: relative;
  display: block;
  overflow: hidden;
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.5s ease;
}

.gallery-item:hover img {
  transform: scale(1.03);
}

/* Overlay */

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.overlay span {
  color: #fff;
  font-size: 1.2rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.gallery-item:hover .overlay {
  opacity: 1;
}   

    /* Contact */
    .contact-form {
      max-width: 520px;
      margin: auto;
      display: grid;
      gap: 1.2rem;
    }
    .contact-form input,
    .contact-form textarea {
      padding: 0.7rem 0;
      border: none;
      border-bottom: 1px solid #ccc;
      font-size: 0.95rem;
      outline: none;
    }
    .contact-form input:focus,
    .contact-form textarea:focus { border-color: #111; }

    .contact-form button {
      margin-top: 1rem;
      padding: 0.7rem;
      background: #111;
      color: #fff;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.85rem;
      color: #888;
    }

  </style>
</head>
<body>

<header>
  <h1>John Davin</h1>
  <p>Photographer</p>
  <nav>
    <a href="about.html">About</a>
    <a href="index.html#contact">Contact</a>
</nav>
</header>


<section id="gallery">
  <h2>Selected Work</h2>

  <div class="gallery-links">

  <a href="monochrome.html" class="gallery-item">
    <img src="images/mono/M3.jpg" alt="Monochrome">
    <div class="overlay">
      <span>Monochrome</span>
    </div>
  </a>

  <a href="landscape.html" class="gallery-item">
    <img src="images/landscape/L1.jpg" alt="Landscape">
    <div class="overlay">
      <span>Landscape</span>
    </div>
  </a>

  <a href="street.html" class="gallery-item">
    <img src="images/street/S2.jpg" alt="Street">
    <div class="overlay">
      <span>Street</span>
    </div>
  </a>

<a href="still.html" class="gallery-item">
    <img src="images/still/St1.jpg" alt="Street">
    <div class="overlay">
      <span>Stillness</span>
    </div>
  </a>

</div>
</section>

<section id="contact">
  <h2>Contact</h2>
  <form class="contact-form" action="https://formspree.io/f/meezygez" method="POST">
    <input type="text" name="name" placeholder="Name" required />
	<input type="email" name="email" placeholder="Email" required />
	<textarea name="message" placeholder="Message" required></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer>© 2026 John Davin</footer>


<div class="lightbox" id="lightbox">
  <div class="lightbox-title" id="lightboxTitle"></div>
  <span class="arrow left" id="prev">‹</span>
  <img />
  <span class="arrow right" id="next">›</span>
</div>

<script>
 
</script>

</body>
</html>
