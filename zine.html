<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zine – John Davin</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #fff;
  color: #111;
}

header {
  padding: 4rem 2rem 2rem;
  text-align: center;
}

header h1 { font-size: 2.5rem; font-weight: 500; }

nav a {
  margin: 0 1rem;
  color: #777;
  text-decoration: none;
}

nav a:hover { color: #111; }

section {
  max-width: 900px;
  margin: 4rem auto;
  padding: 0 2rem;
  text-align: center;
}

.book-cover img {
  width: min(90vw, 350px);
  margin: 2rem auto 0;
  display: block;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.4s ease;
}

/* Mobile adjustment */
@media (max-width: 600px) {
  .book-cover img {
    max-width: 260px;
  }
}

.book-cover img:hover {
  transform: scale(1.02);
}

footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      font-size: 0.85rem;
      color: #888;
}

/* Lightbox */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  align-items: center;
  justify-content: center;
}

.lightbox.active {
  display: flex;
}

.lightbox img {
  max-width: 85%;
  max-height: 85%;
}

.arrow {
  position: absolute;
  color: #fff;
  font-size: 3rem;
  cursor: pointer;
  user-select: none;
}

.arrow.left { left: 5%; }
.arrow.right { right: 5%; }

.close {
  position: absolute;
  top: 3%;
  right: 5%;
  font-size: 2rem;
  color: #fff;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>Zine</h1>
  <nav>
    <a href="index.html">Home</a>
	<a href="index.html#contact">Contact</a>
  </nav>

</header>

<section>
<div class="book-cover">
  <p>
      Please contact me if you would like a free digital copy of "My Photographic Journey Vol. 1"
	  zine or that you would like a printed copy.

	</p><p>  Click on image below to view full 60 page zine:	
    <br></br>	
  </p>

  
    <!-- ONLY ONE IMAGE VISIBLE -->
    <img src="images/book/B1.jpg" alt="Book Cover" id="openSlideshow">

  </div>
</section>

<div class="lightbox" id="lightbox">
  <span class="close" id="close">×</span>
  <span class="arrow left" id="prev">‹</span>
  <img id="lightbox-img">
  <span class="arrow right" id="next">›</span>
   
</div>

<script>
const slideshowImages = [
  "images/book/B1.jpg",
  "images/book/B2.jpg",
  "images/book/B3.jpg",
  "images/book/B4.jpg",
  "images/book/B5.jpg",
  "images/book/B6.jpg",
  "images/book/B7.jpg",
  "images/book/B8.jpg",
  "images/book/B10.jpg",
  "images/book/B11.jpg",
  "images/book/B12.jpg",
  "images/book/B13.jpg",
  "images/book/B14.jpg",
  "images/book/B15.jpg",
  "images/book/B16.jpg",
  "images/book/B17.jpg",
  "images/book/B18.jpg",
  "images/book/B19.jpg",
  "images/book/B20.jpg",
  "images/book/B21.jpg",
  "images/book/B22.jpg",
  "images/book/B23.jpg",
  "images/book/B24.jpg",
  "images/book/B25.jpg",
  "images/book/B26.jpg",
  "images/book/B27.jpg",
  "images/book/B28.jpg",
  "images/book/B29.jpg",
  "images/book/B30.jpg",
  "images/book/B31.jpg",
  "images/book/B32.jpg",
  "images/book/B33.jpg"
];

const openBtn = document.getElementById("openSlideshow");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const prev = document.getElementById("prev");
const next = document.getElementById("next");
const close = document.getElementById("close");

let currentIndex = 0;

function showImage(index) {
  currentIndex = index;
  lightboxImg.src = slideshowImages[currentIndex];
  lightbox.classList.add("active");
}

openBtn.addEventListener("click", () => {
  showImage(0);
});

prev.addEventListener("click", () => {
  currentIndex = (currentIndex - 1 + slideshowImages.length) % slideshowImages.length;
  showImage(currentIndex);
});

next.addEventListener("click", () => {
  currentIndex = (currentIndex + 1) % slideshowImages.length;
  showImage(currentIndex);
});

close.addEventListener("click", () => {
  lightbox.classList.remove("active");
});

lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) {
    lightbox.classList.remove("active");
  }
});

// --- SWIPE SUPPORT ---

let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener("touchstart", (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

lightbox.addEventListener("touchend", (e) => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, { passive: true });

function handleSwipe() {
  const swipeDistance = touchEndX - touchStartX;

  // Minimum swipe distance (adjust if needed)
  if (Math.abs(swipeDistance) > 50) {
    if (swipeDistance > 0) {
      // Swipe Right → Previous image
      currentIndex = (currentIndex - 1 + slideshowImages.length) % slideshowImages.length;
    } else {
      // Swipe Left → Next image
      currentIndex = (currentIndex + 1) % slideshowImages.length;
    }
    showImage(currentIndex);
  }
}

</script>
<footer>© 2026 John Davin</footer>

</body>

</html>
